name: Update articles

on:
  schedule:
    - cron: "17 11 * * *"   # once a day
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest stories
        run: python3 scripts/update_articles.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (git commit -m "Update articles" && git push)
